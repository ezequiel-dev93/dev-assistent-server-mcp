[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-assistant-mcp"
version = "1.2.0"
description = "Hexagonal Architecture Guardian, Linter & Sovereign Persistent SQLite Memory MCP Server for AI Coding Agents."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Ezequiel Suárez", email = "ezequielsuarez.dev@gmail.com" }
]
keywords = ["mcp", "ai-agents", "hexagonal-architecture", "screaming-architecture", "memory", "sqlite", "skill"]
dependencies = [
    "mcp>=1.2.0",
    "pydantic>=2.6.0",
]

[project.urls]
Homepage = "https://www.ezequielsuarez-dev.com/"
Repository = "https://github.com/ezequiel-dev93"

[project.scripts]
dev-assistant-mcp = "src.server:run_server"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
